[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = cansat, receiver, mac_address, camera

[env]
platform = espressif32@6.12.0
framework = arduino
; Example classic ESP32 profile. Confirm your physical board before upload.
board = esp32dev
monitor_speed = 115200

[env:cansat]
build_src_filter = +<cansat.cpp> +<telemetry_log.cpp>
lib_deps =
    adafruit/Adafruit BMP085 Library@1.2.4
    adafruit/Adafruit MPU6050@2.2.6
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.2
    slashdevin/NeoGPS@4.2.9

[env:receiver]
build_src_filter = +<receiver.cpp>

[env:mac_address]
build_src_filter = +<mac_address.cpp>

; Separate camera payload board; never upload this target to the sensor board.
[env:camera]
board = esp32cam
build_src_filter = +<camera.cpp>
